[project]
name = "boneqc-api"
version = "0.1.0"
description = "BoneQC backend API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.14,<2.0",
    "boto3>=1.35,<2.0",
    "redis>=8.0,<9.0",
    "httpx>=0.28,<1.0",
    "pydicom>=3.0.2,<4.0",
    "numpy>=2.5.3,<3.0",
    "pillow>=12.3,<13.0",
    "python-multipart>=0.0.32,<1.0",
    "PyJWT>=2.10,<3.0",
    "pwdlib[argon2]>=0.2,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "ruff>=0.9,<1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
